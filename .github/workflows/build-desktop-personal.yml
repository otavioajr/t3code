name: Build desktop (personal)

# macOS and Windows installers for personal installs of this fork, published as
# a GitHub release that installed apps update from. Run it by hand from the
# Actions tab. Builds carry no T3 Connect config. The Windows installer embeds
# the Linux CLI archive as its WSL runtime, the same way release-desktop.yml does.
#
# macOS builds are signed with a self-signed certificate (secrets
# MAC_SELF_SIGN_P12 and MAC_SELF_SIGN_P12_PASSWORD): Squirrel.Mac installs an
# update only when it is signed by the same certificate as the running app.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: daily

permissions:
  contents: read

env:
  # Points the update feed and the app's release links at this fork.
  T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
  MAC_SELF_SIGN_IDENTITY: T3 Code Fork Signing

jobs:
  # The prerelease suffix keeps installs on the stable update channel, and the
  # run number makes every build newer than the last.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Resolve version and commit
        id: version
        env:
          BUILD_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BUILD_REF}" --jq .sha)
          base=$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/desktop/package.json?ref=${sha}" \
            --jq '.content | @base64d | fromjson | .version')
          echo "version=${base}-fork.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  # The WSL backend runs this archive inside the distro. Without it the Windows
  # app stays on "Connecting WSL" forever.
  cli_linux:
    name: Build Linux x64 CLI archive
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.version.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      # The archive must carry the app version: the Windows build rejects a WSL
      # runtime whose top-level directory names another version.
      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build server and web client
        run: vp run --filter t3 build

      # Runs on the Node from package.json, which the CLI executable requires.
      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-unknown-linux-gnu
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/"

      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts
          --platform linux
          --arch x64
          --version "${{ needs.version.outputs.version }}"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.label }}
    needs: [version, cli_linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      # Sparse checkout skips the vendored .repos tree, whose orphaned gitlinks
      # break actions/checkout's submodule cleanup.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.version.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      # electron-builder signs only with an identity trusted for code signing,
      # so the self-signed certificate is trusted system-wide on the runner.
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        env:
          MAC_SELF_SIGN_P12: ${{ secrets.MAC_SELF_SIGN_P12 }}
          MAC_SELF_SIGN_P12_PASSWORD: ${{ secrets.MAC_SELF_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MAC_SELF_SIGN_P12" || -z "$MAC_SELF_SIGN_P12_PASSWORD" ]]; then
            echo "::error::Set the MAC_SELF_SIGN_P12 and MAC_SELF_SIGN_P12_PASSWORD secrets." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/self-sign.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MAC_SELF_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/self-sign.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/self-sign.p12" -k "$keychain" \
            -P "$MAC_SELF_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/self-sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$MAC_SELF_SIGN_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/self-sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/self-sign.pem"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MAC_SELF_SIGN_IDENTITY"
          echo "T3CODE_DESKTOP_MAC_SELF_SIGN_IDENTITY=$MAC_SELF_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform ${{ matrix.platform }}
            --target ${{ matrix.target }}
            --arch ${{ matrix.arch }}
            --build-version "${{ needs.version.outputs.version }}"
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      # electron-builder silently skips signing when it cannot find the
      # identity, and Squirrel.Mac would never install an unsigned update.
      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/verify-signature"
          mkdir -p "$verify_dir"
          ditto -x -k release/*.zip "$verify_dir"
          codesign --verify --deep --strict "$verify_dir"/*.app
          codesign -dvv "$verify_dir"/*.app 2>&1 | grep -F "Authority=$MAC_SELF_SIGN_IDENTITY"

      # electron-updater downloads the zip, blockmaps and latest*.yml manifests.
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: t3code-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "T3 Code ${VERSION}" \
            --notes "Personal build of ${BUILD_REF} at ${SHA}." \
            --latest
